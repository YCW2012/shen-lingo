<style>

     颜色一律取变量（卡片 --pay-bg、气泡 --wx-bubble-*），与对应底色同源，

  /* 样式自查页用的分组标题。正常对话日志里没有 h 字段，不会渲染出来。 */

     切换是纯本地 DOM 显示/隐藏，不发任何网络请求；数据始终完整在页内，不删不丢。
     JS 不可用时全部平铺显示（.day-body 默认 none 只在 JS 生效后才被 .open 打开）。
     2026-11-01：去掉灰底胶囊，改成和中间「时间」同一行样式（同字号、同色、居中）；
     展开后整行降透明度（同红包卡 .done 的暗化路子），点击不再是「按一个灰按钮」。 */
  .day{display:flex;flex-direction:column;}
  .day-head{
    align-self:center;
    margin:18px 0 4px;
    padding:0 2px;
    border:0;
    background:none;
    color:var(--wx-time);
    font:inherit;
    font-size:12px;
    letter-spacing:.02em;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .16s ease,color .16s ease;
  }
  .day-head:hover{opacity:.82;}
  .day-head:active{opacity:.55;}
  .day.open > .day-head{opacity:.62;}
  .day-caret{display:inline-block;font-size:10px;line-height:1;transition:transform .16s ease;}
  .day:not(.open) .day-caret{transform:rotate(-90deg);}
  .day-body{display:none;flex-direction:column;}
  .day.open .day-body{display:flex;}
  .notice{
    align-self:center;
    margin:16px 0 2px;
    padding:8px 14px;
    max-width:82%;
    text-align:center;
    font-size:12px;
    line-height:1.6;
    color:#9a9aa0;
    background:var(--wx-chip);
    border-radius:10px;
  }

  @media (max-width:560px){
    .chat{padding:14px 12px 32px;}
    .bubble{max-width:72%;}
    .avatar{flex-basis:36px;width:36px;height:36px;}
    .row{gap:7px;}
    .row .sticker{width:126px;height:126px;}
    .row.sticker{gap:14px;}
  }
  @media print{
    body{background:#fff;color:#111;}
    /* 打印时改的是「变量」而不是「背景」：气泡底、文件卡底、支付卡底、以及两侧尖角
       全部由变量派生，改一处就全跟着走，不会留下深色尖角配浅色底。
       三条 --pay-bg 都要写：.done 与 :has() 的权重高于 .bubble.pay，必须同权重覆盖。 */
    :root{--wx-bubble-left:#f2f2f2;--wx-bubble-right:#95ec69;}
    .row.left .bubble{color:#111;}
    .row.right .bubble{color:#111;}
    /* 前景变量也一起覆盖：打印底是浅灰 #f2f2f2，前景若仍是白色，
       待领取卡的文字与图标会完全看不见（实测确实是白字白底）。 */
    .row .bubble.pay{--pay-bg:#f2f2f2;--pay-fg:#333;--pay-src:#666;}
    .row .bubble.pay.done{--pay-bg:#f2f2f2;--pay-fg:#333;--pay-src:#666;}
    .row .bubble.pay:has(.wx-pay.done){--pay-bg:#f2f2f2;--pay-fg:#333;--pay-src:#666;}
    .bubble,.row .sticker{box-shadow:none;filter:none;}
    .row{break-inside:avoid;}
  }
</style>
</head>
<body>

<main class="chat" id="chat" aria-label="小深与用户的聊天记录">

__MESSAGES__

</main>

<!-- SYSTEM-TAGS:BEGIN
__SYSTEM_TAGS__
SYSTEM-TAGS:END -->

<script>
/* 按天分块：把已渲染的 .time 分隔线与 .row 气泡按日期归组，最近 3 天默认展开，
   更早的折叠为一行可点开的日期摘要。纯本地 DOM 显示切换，不发请求、不改数据。
   注意：分块结构完全由本脚本生成——脚本不执行时页面就是原始平铺记录，不会隐藏任何内容。 */
(function(){
  var chat = document.getElementById('chat');
  if (!chat) return;
  var EXPAND_DAYS = 3;
  var dateOf = function(label){
    var m = String(label).match(/(\d{1,2})\u6708(\d{1,2})\u65e5/);
    return m ? (m[1] + '\u6708' + m[2] + '\u65e5') : String(label).trim();
  };
  var timeOnly = function(label){
    var m = String(label).match(/(\d{1,2}:\d{2})/);
    return m ? m[1] : String(label).trim();
  };
  var notices = [];
  var segs = [];
  var cur = null;
  Array.prototype.slice.call(chat.children).forEach(function(n){
    if (n.classList && n.classList.contains('notice')) { notices.push(n); return; }
    if (n.classList && n.classList.contains('time')) {
      cur = { date: dateOf(n.textContent), nodes: [n] };
      segs.push(cur);
      return;
    }
    if (!cur) { cur = { date: '', nodes: [] }; segs.push(cur); }
    cur.nodes.push(n);
  });

  var days = [];
  segs.forEach(function(s){
    var last = days[days.length - 1];
    if (last && last.date === s.date) last.nodes = last.nodes.concat(s.nodes);
    else days.push({ date: s.date, nodes: s.nodes.slice() });
  });

  var frag = document.createDocumentFragment();
  notices.forEach(function(n){ frag.appendChild(n); });

  var autoOpen = [];

  days.forEach(function(day, i){
    var expanded = i >= days.length - EXPAND_DAYS;
    var count = day.nodes.filter(function(n){ return n.classList && n.classList.contains('row'); }).length;
    var wrap = document.createElement('div');
    wrap.className = 'day' + (expanded ? ' open' : '');

    var head = document.createElement('button');
    head.type = 'button';
    head.className = 'day-head';
    head.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    var dateEl = document.createElement('span'); dateEl.className = 'day-date'; dateEl.textContent = day.date || '\u66F4\u65E9';
    var metaEl = document.createElement('span'); metaEl.className = 'day-meta';
    var caretEl = document.createElement('span'); caretEl.className = 'day-caret'; caretEl.textContent = '\u25BE';
    /* 只显示「N 条」：能不能点已由箭头方向和透明度表达，不再挂「点击展开」四个字 */
    var metaText = function(){ return count + ' \u6761'; };
    metaEl.textContent = metaText();
    head.appendChild(dateEl); head.appendChild(metaEl); head.appendChild(caretEl);

    var body = document.createElement('div');
    body.className = 'day-body';
    day.nodes.forEach(function(n){
      if (n.classList && n.classList.contains('time')) n.textContent = timeOnly(n.textContent);
      body.appendChild(n);
    });

    head.addEventListener('click', function(){
      wrap.classList.toggle('open');
      head.setAttribute('aria-expanded', wrap.classList.contains('open') ? 'true' : 'false');
    });

    wrap.appendChild(head);
    wrap.appendChild(body);
    frag.appendChild(wrap);
    if (!expanded) autoOpen.push(wrap);
  });

  chat.innerHTML = '';
  chat.appendChild(frag);

  /* 预加载展开：只在**向上滚**且折叠条快要进入视口时（上方 400px 以内）自动展开，
     一次只开一个，避免一打开页面就把所有历史摊平。展开会让上方内容变高、把视口顶下去，
     所以按新增高度把滚动位置补回来，视野不跳。 */
  (function(){
    if (!autoOpen.length) return;
    var pending = autoOpen.slice();
    var lastY = window.scrollY;
    function openOne(){
      if (!pending.length) return;
      var vh = window.innerHeight;
      for (var i = 0; i < pending.length; i++) {
        var r = pending[i].getBoundingClientRect();
        if (r.top > vh + 400) continue;      // 还在下面很远，等滚近再说
        if (r.bottom < -400) break;          // 还在上面很远（更早的那几天），这次不补开
        var w = pending.splice(i, 1)[0];
        var h0 = w.getBoundingClientRect().height;
        w.classList.add('open');
        var hd = w.querySelector('.day-head');
        if (hd) hd.setAttribute('aria-expanded', 'true');
        var dh = w.getBoundingClientRect().height - h0;
        if (dh > 0) window.scrollBy(0, dh);
        return;                              // 一次只开一个
      }
    }
    window.addEventListener('scroll', function(){
      var y = window.scrollY;
      var up = y < lastY;
      lastY = y;
      if (up) openOne();
    }, { passive: true });
  })();
})();
</script>

<script>window.scrollTo(0, document.body.scrollHeight);</script>
</body>
