     发出气泡亮绿 #35d28d 配深字；气泡小圆角、无阴影、不做卡片边框。
     表情包消息不套气泡：原图直出、固定 144×144 正方形、圆角 8px（与头像一致）、

  5. 系统标签（add / search / 表情包 / live2d_expr 等）只允许写在
     底部 SYSTEM-TAGS 注释块里，禁止出现在可见界面。
  6. 所有图片均为内联 base64，页面不请求任何外部资源，离线可看。
  7. 页面底部必须保留 window.scrollTo 自动滚动脚本，打开即定位到最新一条。

<style>
  :root{
    /* 深色模式：对齐微信夜间配色，取自参考图逐像素采样——
       背景 #1e1e1f；收到气泡深灰 #2f2f30（白字）；发出气泡亮绿 #35d28d（深字）。 */
    --wx-bg:#1e1e1f;
    --wx-bubble-left:#2f2f30;
    --wx-bubble-right:#35d28d;
    --wx-bubble-right-text:#0f1a14;
    --wx-text:#e1e1e5;
    --wx-time:#8a8a90;
    --wx-chip:rgba(255,255,255,.06);
    --wx-chip-hover:rgba(255,255,255,.12);
    --shen-blue:#4a7ede;
    --shen-blue-soft:#cfe0ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--wx-bg);
    color:var(--wx-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .chat{
    max-width:820px;
    margin:0 auto;
    padding:18px 16px 40px;
    display:flex;
    flex-direction:column;
    /* 微信气泡不可自由选字：禁用选区，右键/长按不再残留蓝底高亮 */
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .time{
    align-self:center;
    margin:20px 0 6px;
    font-size:12px;
    color:var(--wx-time);
    letter-spacing:.02em;
  }
  .row{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin-top:14px;
  }
  .row.right{justify-content:flex-end;}

  .avatar{
    flex:0 0 40px;
    width:40px;
    height:40px;
    border-radius:8px;
    overflow:hidden;
    background-color:var(--shen-blue-soft);
    background-image:linear-gradient(140deg,var(--shen-blue) 0%,var(--shen-blue-soft) 100%);
    background-size:cover;
    background-position:50% 16%;
    background-repeat:no-repeat;
    box-shadow:0 1px 3px rgba(0,0,0,.45);
    display:block;
  }
  .bubble{
    position:relative;
    max-width:64%;
    padding:9px 12px;
    border-radius:6px;
    font-size:15px;
    line-height:1.62;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    box-shadow:none;
  }
  .row.left .bubble{background:var(--wx-bubble-left);}
  .row.right .bubble{background:var(--wx-bubble-right);color:var(--wx-bubble-right-text);}
  /* ── 尖角（气泡尾巴 / 卡片小尖）────────────────────────────────
     尖角是 build_html.cjs 生成的内联 SVG（`svg.tail`），由 4 个 1px 宽的
     整数矩形拼出列高 2/4/6/8 的阶梯。**全部坐标都是整数、没有斜线**，
     所以既没有抗锯齿、也不需要任何开关。
     为什么不用 border 画的三角形：45° 斜边一定会被抗锯齿糊出一条
     「底色与背景色各半」的混色像素，在深色背景上看起来就是尖角外沿的
     一条深色描边 —— 用户 2026-10-04 截图圈出来的「尖尖颜色和底色不一致」
     正是它。改成整数矩形后，尖角里只剩两种颜色：底色本身 + 页面背景色。
     ★ 不需要 shape-rendering:crispEdges：整数矩形没有斜线，没有锯齿可压。
       对照实验（同一页只多这一条声明，逐像素量）：加与不加完全一致，
       左右凸出都是 4px、剖面都是 2/4/6/8 —— 它是多余项，不是「加了会坏」。
       旧版用 border / <path> 画斜边时它才会整体右移 1px（左侧只剩 3px），
       那个结论不适用于现在这套整数矩形，别照旧结论去「修」。
     颜色一律取变量（卡片 --pay-bg、气泡 --wx-bubble-*），与对应底色同源，
     不会再出现「橙角配褐底」；打印模式也只是换变量值，尖角自动跟着变浅。
     ★ 也不要用 transform:scaleX(-1) 做镜像（会触发重新采样、把抗锯齿带回来）：
       左右两侧的形状由 build_html.cjs 用互为镜像的整数坐标直接生成。 */
  .bubble > .tail{
    position:absolute;
    display:block;
    pointer-events:none;
  }
  /* 两种尖角都是 4 宽 8 高、列高 2/4/6/8 的阶梯，全部落在气泡外侧；
     气泡尖角比卡片尖角高 2px（离顶 11px vs 13px），与原边框三角的视觉位置一致。 */
  .bubble > .tail.tp{top:13px;width:4px;height:8px;}
  .bubble > .tail.tb{top:11px;width:4px;height:8px;}
  .row.left .bubble > .tail.tp{left:-4px;fill:var(--pay-bg,#e18d35);}
  .row.right .bubble > .tail.tp{right:-4px;fill:var(--pay-bg,#e18d35);}
  .row.left .bubble > .tail.tb{left:-4px;fill:var(--wx-bubble-left);}
  /* 右侧尖角在气泡**右**外侧、尖朝右（和发出方的气泡同侧）。
     2026-10-04 用户拿真机截图纠正：上一版写成 left:-9px（尖朝左）方向是反的。
     真机里发出消息的尖角长在气泡右边，指向我这一侧。 */
  .row.right .bubble > .tail.tb{right:-4px;fill:var(--wx-bubble-right);}
  /* 文件卡：收发两侧底色都是 --wx-bubble-left，尖角必须跟着走 */
  .row.right .bubble.file > .tail.tb{fill:var(--wx-bubble-left);}

  /* 微信「表情包」消息：统一正方形 + 圆角，圆角半径与头像一致（8px）。
     三条硬约束（对齐 10/03 参考图）：
     1) 尺寸统一——固定 144×144，约为头像 40px 的 3.6 倍（微信实测 129/36≈3.6）。
        不写 max-width 百分比：窄屏会只压宽度不压高度，把方框拉变形；
     2) 图片用 background-size:cover 铺满方框。原图比例在 0.89~1.09 之间，
        contain 会按各自比例留白，看上去大小不一；cover 裁掉边角让外框完全一致；
     3) 圆角 8px，与 .avatar 的 border-radius 对齐。
     选择器必须写成「.row .sticker」（后代），因为行容器本身也带 sticker 类；
     否则 .sticker 里的 display:block 会覆盖 .row 的 display:flex，导致表情包掉到头像下方。 */
  .row .sticker{
    flex:0 0 auto;
    width:144px;
    height:144px;
    border-radius:8px;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    filter:none;
    box-shadow:none;
    display:block;
  }
  .row.sticker{gap:16px;align-items:flex-start;}
  /* 【已移除】右侧（我）的头像占位块 `.avatar.me`。
     2026-10-04 用户明确：「我发给你消息，我这边不需要头像」——
     与模板顶部硬约束第 3 条「用户在右：绝对不加任何头像」一致。
     曾经加过一版灰底「阿」字占位头像，是误读需求，已删。
     真要加回来：build_html.cjs 里右侧三个分支各补一行 <span class="avatar me"></span>，
     并把下面这段样式恢复：
       .avatar.me{background-color:#3a3d42;background-image:linear-gradient(140deg,#4a4f57 0%,#7b838f 100%);}
       .avatar.me::after{content:"\963f";display:block;text-align:center;font-size:16px;line-height:40px;color:#f0f2f5;}
     —— 但注意：一旦加回头像，右侧气泡尖角要跟着改回指向头像那一侧。 */
  /* 样式自查页用的分组标题。正常对话日志里没有 h 字段，不会渲染出来。 */
  .grp{
    align-self:center;
    margin:30px 0 2px;
    padding:4px 14px;
    border-radius:999px;
    background:var(--wx-chip);
    font-size:12px;
    line-height:1.5;
    color:#9fb4d8;
    letter-spacing:.04em;
  }


  /* 微信「文件」消息：卡片式气泡，深灰底（收发两侧都不用绿色），结构与微信一致——
     左侧文件名（最多两行，列宽上限 150px）+ 大小/状态，右侧红色文档图标（右上折角），
     底部一行来源。尺寸取自参考图逐像素采样：卡片宽 246px、内边距 12px、
     文件名 14px/1.36、大小行 13px、来源行 12px；窄屏由 max-width 兜底。 */
  .bubble.file{
    width:246px;
    max-width:80%;
    padding:12px 12px 9px;
    background:var(--wx-bubble-left);
    /* 卡片内部必须关掉气泡继承来的 pre-wrap：否则标签之间的换行缩进会被渲染成空行，
       卡片高度会从 ~105px 被撑到 ~400px。 */
    white-space:normal;
  }
  .row.right .bubble.file{background:var(--wx-bubble-left);}
  /* 右侧文件卡的尖角颜色在上面「尖角」块里统一写（同样取 --wx-bubble-left）。
     旧的 .bubble.file::before 边框三角已废弃：改由内联 SVG 画，才关得掉抗锯齿。 */
  .file-head{display:flex;align-items:flex-start;gap:14px;}
  .file-info{flex:1 1 auto;min-width:0;max-width:150px;margin-right:auto;}
  .file-name{
    font-size:14px;
    line-height:1.36;
    color:var(--wx-text);
    word-break:break-all;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .file-meta{
    margin-top:4px;
    font-size:13px;
    line-height:1.4;
    color:var(--wx-time);
  }
  .file-icon{
    position:relative;
    flex:0 0 auto;
    width:32px;
    height:40px;
    border-radius:3px;
    background:#e14949;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top:8px;
    overflow:hidden;
  }
  /* 右上折角＝两块三角拼成：上面那块用气泡底色切出缺口，下面那块是深红翻页。
     参考图里缺口露出的正是卡片底色（采样值 #2f2f30），所以不能写死白色。 */
  .file-icon::before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    width:11px;
    height:11px;
    background:var(--wx-bubble-left);
    clip-path:polygon(0 0,100% 0,100% 100%);
  }
  .file-icon::after{
    content:"";
    position:absolute;
    top:0;
    right:0;
    width:11px;
    height:11px;
    background:#b23a30;
    clip-path:polygon(0 0,0 100%,100% 100%);
  }
  .file-icon i{
    font-style:normal;
    font-size:10px;
    font-weight:700;
    letter-spacing:.04em;
    color:#fff;
  }
  .file-src{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:10px;
    font-size:12px;
    line-height:1.3;
    color:var(--wx-time);
  }
  .file-src svg{flex:0 0 auto;width:12px;height:12px;}

  /* ===== 微信红包 / 转账卡片（2026-10-04 按用户新给的 3 张真机截图逐像素重做）=====
     采样结论（真机深色模式，三张图气泡都是 251px 宽 = 247 本体 + 4 尖角）：
       · 底色是**纯色 #e18d35**，不是渐变（21837 像素里 92% 同值）；
       · 尖角是 4×8 的小三角挂在气泡外侧（不是上一版的 10×10），纵向离顶 13px；
       · 红包＝红封套（身 #e14949 / 盖 #fa5151 / 金印 #ffcf33）；转账＝白描边圆＋上下双向箭头；
       · 「微信红包」/「微信转账」小字固定在左下角，12px、白 80%；
       · 已领完：整卡底色压暗成 #af6e29（实测 = #e18d35 × 0.777），文字压到白 30%
         （#c79969 = 白 30% 叠在 #af6e29 上，R/G/B 三通道都吻合），
         封套换成「开过的褐色版」，标题下面多一行「已被领完」。 */
  /* 用 !important 硬压：`.row.left .bubble` / `.row.right .bubble` 的背景与 padding 权重相同，
     只要模板里那两条规则排在后面就会把卡片又包回一层气泡（真机截图里出现过灰/绿底露边）。 */
  .row.left .bubble.pay,
  .row.right .bubble.pay{
    padding:0 !important;
    background:transparent !important;
    border:0 !important;
    box-shadow:none !important;
    width:247px;
    /* 窄屏（<344px）不允许卡片顶出屏幕：真机上卡片也是自适应收窄的 */
    max-width:calc(100vw - 40px);
    /* 和 .bubble.file 同一个坑：父级 .bubble 带 white-space:pre-wrap，
       而生成标记里「卡片 div 与内层 wx-pay 之间」的换行缩进是真实文本节点，
       被当成空行渲染 —— 实测把卡片气泡从 90px 撑到 187px（多出约 97px 空白）。
       font-size:0 是双保险：万一还有残留空白节点也不占高（子元素都自带字号）。 */
    white-space:normal;
    font-size:0;
  }
  /* 卡片底色只在 --pay-bg 这一处定义：卡片本体、左右两侧的小尖角全都取同一个变量，
     所以两者永远逐色一致。上一版把 #e18d35 / #af6e29 在「卡片」和「尖角」上各写了一遍，
     状态一多就出现「橙角配褐底」。以后加状态只改这一个变量。
     值带兜底：万一有页面把 .wx-pay 写在 .bubble.pay 外面，变量缺失时仍退回未领取橙。 */
  .row .bubble.pay{--pay-bg:#e18d35;--pay-fg:#fff;--pay-src:rgba(255,255,255,.8);}
  .row .bubble.pay.done{--pay-bg:#af6e29;--pay-fg:rgba(255,255,255,.3);--pay-src:rgba(255,255,255,.3);}
  /* 兼容没带 done 类的老标记：:has() 必须单独成条 —— 和上面写成同一个选择器列表时，
     不支持 :has() 的浏览器会把整条规则一起丢掉，连 --pay-bg 的默认值都定义不出来。 */
  .row .bubble.pay:has(.wx-pay.done){--pay-bg:#af6e29;--pay-fg:rgba(255,255,255,.3);--pay-src:rgba(255,255,255,.3);}
  .wx-pay{
    box-sizing:border-box;
    width:247px;
    height:87px;
    padding:11px 12px 9px 11px;
    border-radius:6px;
    background:var(--pay-bg,#e18d35);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .pay-top{display:flex;align-items:center;gap:13px;height:44px;}
  /* 图标前景与文字同源：--pay-fg 一处定义，图标（描边用 currentColor）与文字一起变。
     2026-10-04 用户截图：已收款卡的圆环+对勾仍是纯白，卡片却已压暗，亮度对不上；
     真机参考图逐像素量到圆环平台色 = #c79a6a = 白 30% 叠在 #af6e29 上，与文字完全一致。 */
  .pay-ico{flex:0 0 auto;display:block;color:var(--pay-fg,#fff);}
  .pay-ico svg{display:block;width:100%;height:100%;}
  /* 转账＝白描边圆（真机圆径约 38px）；红包＝竖封套 36×44（真机量到 36×44） */
  .pay-ico.tf-ico{width:38px;height:38px;}
  .rp-ico{width:36px;height:44px;}
  .pay-col{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .pay-amt{color:var(--pay-fg,#fff);font-size:16px;line-height:1.2;font-weight:600;}
  .pay-sub{color:var(--pay-fg,#fff);font-size:12px;line-height:1.25;}
  .pay-title{color:var(--pay-fg,#fff);font-size:15px;line-height:1.25;font-weight:500;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pay-src{color:var(--pay-src,rgba(255,255,255,.8));font-size:12px;line-height:16px;}
  /* 已领完／已退还的整卡前景（文字 + 图标）改由上面 .done / :has() 的
     --pay-fg / --pay-src 承担，不再逐条写颜色 —— 逐条列举时漏掉了 .pay-ico，
     于是出现「卡片压暗了、圆环还亮着」。以后加状态只改这两个变量。 */
  /* 卡片尖角的几何（4 宽 8 高、离顶 13px）与配色（--pay-bg）已并入上面统一的
     「尖角」块。这里不再单独写一套 ::before —— 卡片、尖角两处各写一份颜色，
     正是过去漏同步、出现「橙角配褐底」的根源。 */
  /* 系统提示条：居中灰字，关键词橙色（真机「Aura领取了你的红包」那条） */
  .row.sys{justify-content:center;}
  .sys-note{
    max-width:78%;
    text-align:center;
    font-size:12px;
    line-height:1.5;
    color:var(--wx-time);
    word-break:break-word;
  }

<body>

<main class="chat" id="chat" aria-label="小深与用户的聊天记录">

__MESSAGES__

</main>

<div class="xs-menu" id="xsMenu" role="menu">
  <button type="button" id="xsCopy">复制</button>
  <button type="button" id="xsDel" class="danger">删除这条</button>
  <button type="button" id="xsMulti">多选</button>
  <div class="sep"></div>
  <button type="button" id="xsReset">恢复全部</button>
  <button type="button" id="xsCancel">取消</button>
</div>
<div class="xs-toast" id="xsToast" data-del="已删除  ·  点此撤销" data-reset="已恢复全部" data-unit="条"></div>
<div class="xs-selbar" id="xsSelBar">
  <button type="button" id="xsSelCancel">取消</button>
  <button type="button" id="xsSelAll">全选</button>
  <span class="right">
    <button type="button" id="xsSelCopy" class="act" disabled>复制(<span id="xsSelN">0</span>)</button>
    <button type="button" id="xsSelDel" class="act" disabled>删除(<span id="xsSelN2">0</span>)</button>
  </span>
</div>

<script>
/* 按天分块：把已渲染的 .time 分隔线与 .row 气泡按日期归组，最近 3 天默认展开，
   更早的折叠为一行可点开的日期摘要。纯本地 DOM 显示切换，不发请求、不改数据。
   注意：分块结构完全由本脚本生成——脚本不执行时页面就是原始平铺记录，不会隐藏任何内容。 */
(function(){
  var chat = document.getElementById('chat');
  if (!chat) return;
  var EXPAND_DAYS = 3;
  var dateOf = function(label){
    var m = String(label).match(/(\d{1,2})\u6708(\d{1,2})\u65e5/);
    return m ? (m[1] + '\u6708' + m[2] + '\u65e5') : String(label).trim();
  };
  var timeOnly = function(label){
    var m = String(label).match(/(\d{1,2}:\d{2})/);
    return m ? m[1] : String(label).trim();
  };
  var notices = [];
  var segs = [];
  var cur = null;
  Array.prototype.slice.call(chat.children).forEach(function(n){
    if (n.classList && n.classList.contains('notice')) { notices.push(n); return; }
    if (n.classList && n.classList.contains('time')) {
      cur = { date: dateOf(n.textContent), nodes: [n] };
      segs.push(cur);
      return;
    }
    if (!cur) { cur = { date: '', nodes: [] }; segs.push(cur); }
    cur.nodes.push(n);
  });

  var days = [];
  segs.forEach(function(s){
    var last = days[days.length - 1];
    if (last && last.date === s.date) last.nodes = last.nodes.concat(s.nodes);
    else days.push({ date: s.date, nodes: s.nodes.slice() });
  });

  var frag = document.createDocumentFragment();
  notices.forEach(function(n){ frag.appendChild(n); });

  var autoOpen = [];

  days.forEach(function(day, i){
    var expanded = i >= days.length - EXPAND_DAYS;
    var count = day.nodes.filter(function(n){ return n.classList && n.classList.contains('row'); }).length;
    var wrap = document.createElement('div');
    wrap.className = 'day' + (expanded ? ' open' : '');

    var head = document.createElement('button');
    head.type = 'button';
    head.className = 'day-head';
    head.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    var dateEl = document.createElement('span'); dateEl.className = 'day-date'; dateEl.textContent = day.date || '\u66F4\u65E9';
    var metaEl = document.createElement('span'); metaEl.className = 'day-meta';
    var caretEl = document.createElement('span'); caretEl.className = 'day-caret'; caretEl.textContent = '\u25BE';
    /* 只显示「N 条」：能不能点已由箭头方向和透明度表达，不再挂「点击展开」四个字 */
    var metaText = function(){ return count + ' \u6761'; };
    metaEl.textContent = metaText();
    head.appendChild(dateEl); head.appendChild(metaEl); head.appendChild(caretEl);

    var body = document.createElement('div');
    body.className = 'day-body';
    day.nodes.forEach(function(n){
      if (n.classList && n.classList.contains('time')) n.textContent = timeOnly(n.textContent);
      body.appendChild(n);
    });

    head.addEventListener('click', function(){
      wrap.classList.toggle('open');
      head.setAttribute('aria-expanded', wrap.classList.contains('open') ? 'true' : 'false');
    });

    wrap.appendChild(head);
    wrap.appendChild(body);
    frag.appendChild(wrap);
    if (!expanded) autoOpen.push(wrap);
  });

  chat.innerHTML = '';
  chat.appendChild(frag);

  /* 预加载展开：只在**向上滚**且折叠条快要进入视口时（上方 400px 以内）自动展开，
     一次只开一个，避免一打开页面就把所有历史摊平。展开会让上方内容变高、把视口顶下去，
     所以按新增高度把滚动位置补回来，视野不跳。 */
  (function(){
    if (!autoOpen.length) return;
    var pending = autoOpen.slice();
    var lastY = window.scrollY;
    function openOne(){
      if (!pending.length) return;
      var vh = window.innerHeight;
      for (var i = 0; i < pending.length; i++) {
        var r = pending[i].getBoundingClientRect();
        if (r.top > vh + 400) continue;      // 还在下面很远，等滚近再说
        if (r.bottom < -400) break;          // 还在上面很远（更早的那几天），这次不补开
        var w = pending.splice(i, 1)[0];
        var h0 = w.getBoundingClientRect().height;
        w.classList.add('open');
        var hd = w.querySelector('.day-head');
        if (hd) hd.setAttribute('aria-expanded', 'true');
        var dh = w.getBoundingClientRect().height - h0;
        if (dh > 0) window.scrollBy(0, dh);
        return;                              // 一次只开一个
      }
    }
    window.addEventListener('scroll', function(){
      var y = window.scrollY;
      var up = y < lastY;
      lastY = y;
      if (up) openOne();
    }, { passive: true });
  })();
})();
</script>

<script>
/* 页面内操作（纯前端 · V0.0421）：长按/右键气泡 -> 菜单 -> 复制 / 删除这条 / 多选（批量删、批量复制）。
   预览卡是客户端本地打开的静态快照，origin 为 sale-remote-file://remote-files（全局共享，
   不按会话隔离），所以 key 必须带会话号，否则不同对话的删除记录会串。
   只改显示，不改 IMA、不发任何网络请求、不写凭证。可见文案一律放在 HTML 的 data-* 属性里，
   因为 build_html.cjs 会整篇实体化，script 是 raw text，不解码 HTML 实体。 */
(function(){
  var chat = document.getElementById('chat');
  if (!chat) return;
  var menu = document.getElementById('xsMenu');
  var toast = document.getElementById('xsToast');
  var delBtn = document.getElementById('xsDel');
  var resetBtn = document.getElementById('xsReset');
  var cancelBtn = document.getElementById('xsCancel');
  var copyBtn = document.getElementById('xsCopy');
  var multiBtn = document.getElementById('xsMulti');
  var selBar = document.getElementById('xsSelBar');
  var selCancel = document.getElementById('xsSelCancel');
  var selAll = document.getElementById('xsSelAll');
  var selCopy = document.getElementById('xsSelCopy');
  var selDel = document.getElementById('xsSelDel');
  var selN = document.getElementById('xsSelN');
  var selN2 = document.getElementById('xsSelN2');
  if (!menu || !toast || !delBtn || !copyBtn || !multiBtn || !resetBtn || !cancelBtn
      || !selBar || !selCancel || !selAll || !selCopy || !selDel || !selN || !selN2) return;

  var scope = 'default';
  try {
    var sm = String(location.href).match(/:\/\/[^/]+\/([^/?#]+)/);
    if (sm && sm[1]) scope = sm[1];
  } catch (e) {}
  var KEY = 'xs.deleted.v1.' + scope;

  function read(){
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return {};
      var o = JSON.parse(raw);
      return (o && typeof o === 'object') ? o : {};
    } catch (e) { return {}; }
  }
  var deleted = read();
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(deleted)); return true; } catch (e) { return false; } }

  function rowText(row){
    var b = row.querySelector('.bubble, .sticker');
    var s = b ? (b.textContent || '') : (row.textContent || '');
    if (!s && b) s = b.getAttribute('aria-label') || '';

  function copyText(txt){

      try { navigator.clipboard.writeText(txt); return true; } catch (e) {}
    }

  function fp(row){
    var b = row.querySelector('.bubble, .sticker');
    var s = String(b ? (b.textContent || '') : (row.textContent || '')).replace(/\s+/g, ' ').trim();
    var label = b && b.getAttribute('aria-label') ? b.getAttribute('aria-label') : '';
    var cls = String(row.className || '').replace(/\bxs-sel\b/g, '').replace(/\s+/g, ' ').trim();
    var raw = cls + '|' + label + '|' + s;
    var h = 2166136261;
    for (var i = 0; i < raw.length; i++) {
      h ^= raw.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h.toString(36);
  }

  function apply(){
    var rows = Array.prototype.slice.call(chat.querySelectorAll('.row:not(.sys)'));
    var seen = {}, i, row, f, n, k;
    for (i = 0; i < rows.length; i++) {
      row = rows[i];
      f = fp(row);
      n = seen[f] = (seen[f] || 0) + 1;
      k = f + '#' + n;
      row.setAttribute('data-xsk', k);
      if (deleted[k]) row.style.display = 'none';
      else row.style.removeProperty('display');
    }
    /* 该时段消息删空时，连时间分隔线一起收起 */
    var seq = Array.prototype.slice.call(chat.querySelectorAll('.time, .row'));
    for (i = 0; i < seq.length; i++) {
      if (!seq[i].classList.contains('time')) continue;
      var visible = false;
      for (var j = i + 1; j < seq.length; j++) {
        if (seq[j].classList.contains('time')) break;
        if (seq[j].classList.contains('row') && !seq[j].classList.contains('sys')
            && seq[j].style.display !== 'none') { visible = true; break; }
      }
      seq[i].style.display = visible ? '' : 'none';
    }
    /* 折叠条上的「N 条」跟着可见数走 */
    var wraps = chat.querySelectorAll('.day');
    for (i = 0; i < wraps.length; i++) {
      var body = wraps[i].querySelector('.day-body');
      var meta = wraps[i].querySelector('.day-meta');
      if (!body || !meta) continue;
      var rs = body.querySelectorAll('.row:not(.sys)'), cnt = 0;
      for (var q = 0; q < rs.length; q++) if (rs[q].style.display !== 'none') cnt++;
      meta.textContent = cnt + ' ' + toast.getAttribute('data-unit');
    }
  }

  var target = null, lastKey = null, timer = null, press = null, selMode = false;

  function selectedRows(){ return Array.prototype.slice.call(chat.querySelectorAll('.row.xs-sel')); }
  function updateSelBar(){
    var sel = selectedRows(), n = sel.length;
    selN.textContent = n; selN2.textContent = n;
    var dis = n === 0; selCopy.disabled = dis; selDel.disabled = dis;

    selBar.classList.remove('on');

  function show(x, y, row){

    menu.classList.add('on');
    var w = menu.offsetWidth, h = menu.offsetHeight;
    var left = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    var top = Math.max(8, Math.min(y, window.innerHeight - h - 8));

    menu.style.top = top + 'px';
  }
  function rowFrom(node){
    while (node && node !== chat) {
      if (node.classList && node.classList.contains('row') && !node.classList.contains('sys')) return node;
      node = node.parentNode;
    }
    return null;
  }
  function clearPress(){ if (press) { clearTimeout(press); press = null; } }
  function clearSel(){ try { var s = window.getSelection(); if (s && s.removeAllRanges) s.removeAllRanges(); } catch (e) {} }
  function say(msg){
    toast.textContent = msg;
    toast.classList.add('on');
    if (timer) clearTimeout(timer);
    timer = setTimeout(function(){ toast.classList.remove('on'); lastKey = null; }, 4000);
  }

  /* 多选模式下不弹菜单，点击行即切换选择 */
  chat.addEventListener('click', function(e){
    if (!selMode) return;
    var row = rowFrom(e.target);
    if (row) toggleSel(row);
  });

  chat.addEventListener('contextmenu', function(e){
    if (selMode) return;
    var row = rowFrom(e.target);
    if (!row) return;
    e.preventDefault();

  });
  chat.addEventListener('mousedown', function(e){
    if (selMode) return;
    var row = rowFrom(e.target);
    if (!row) return;
    clearPress();
    press = setTimeout(function(){ show(e.clientX, e.clientY, row); }, 500);
  });
  chat.addEventListener('touchstart', function(e){
    if (selMode) return;
    var row = rowFrom(e.target);
    if (!row || !e.touches || !e.touches[0]) return;
    clearPress();
    var x = e.touches[0].clientX, y = e.touches[0].clientY;
    press = setTimeout(function(){ show(x, y, row); }, 500);
  }, { passive: true });
  ['mouseup','mouseleave','touchend','touchmove','scroll'].forEach(function(ev){
    chat.addEventListener(ev, clearPress, { passive: true });
    window.addEventListener(ev, clearPress, { passive: true });
  });
  document.addEventListener('click', function(e){
    if (selMode) return;
    if (!menu.contains(e.target) && e.target !== toast) hide();
  }, false);

  delBtn.addEventListener('click', function(){
    if (!target) { hide(); return; }
    lastKey = target.getAttribute('data-xsk');
    if (lastKey) { deleted[lastKey] = 1; save(); apply(); }
    hide();
    say(toast.getAttribute('data-del'));
  });
  resetBtn.addEventListener('click', function(){
    deleted = {};
    try { localStorage.removeItem(KEY); } catch (e) {}
    apply();
    lastKey = null;
    hide();
    say(toast.getAttribute('data-reset'));
  });
  cancelBtn.addEventListener('click', hide);
  toast.addEventListener('click', function(){
    if (lastKey) { delete deleted[lastKey]; save(); apply(); }
    lastKey = null;
    toast.classList.remove('on');
  });

  copyBtn.addEventListener('click', function(){
    if (!target) { hide(); return; }
    var ok = copyText(rowText(target));
    hide();
    say(ok ? '\u5DF2\u590D\u5236' : '\u590D\u5236\u5931\u8D25');
  });
  multiBtn.addEventListener('click', function(){ enterSel(); });
  selCancel.addEventListener('click', exitSel);
  selAll.addEventListener('click', function(){
    var vis = Array.prototype.slice.call(chat.querySelectorAll('.row:not(.sys)'))
      .filter(function(r){ return r.style.display !== 'none'; });
    var allSel = vis.length > 0 && vis.every(function(r){ return r.classList.contains('xs-sel'); });
    vis.forEach(function(r){ r.classList.toggle('xs-sel', !allSel); });
    updateSelBar();
  });
  selCopy.addEventListener('click', function(){
    var sel = selectedRows();
    if (!sel.length) return;
    var ok = copyText(sel.map(rowText).join('\n'));
    say(ok ? ('\u5DF2\u590D\u5236 ' + sel.length + ' \u6761') : '\u590D\u5236\u5931\u8D25');
  });
  selDel.addEventListener('click', function(){
    var sel = selectedRows();
    if (!sel.length) return;
    sel.forEach(function(r){
      var k = r.getAttribute('data-xsk');
      if (k) deleted[k] = 1;
    });
    save(); apply(); exitSel();
    say('\u5DF2\u5220\u9664 ' + sel.length + ' \u6761');
  });

  apply();
})();
</script>

<script>window.scrollTo(0, document.body.scrollHeight);</script>
</body>
</html>
